
server {

    listen 80 reuseport;

    limit_conn addr 50;

    location / {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://ejecution:${PORT};
    }

    location ~ /\.git {
        deny all;
    }
    
    location ~ /\.gitlab {
	    deny all;
	}
}
